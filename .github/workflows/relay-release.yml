name: Relay Release

# relayd ships on its own cadence under a relay-v* tag, keeping its version
# independent of the client's v* tags.
on:
  push:
    tags:
      - "relay-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the relay-v prefix (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: relay-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#relay-v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=relay-v$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Build
        working-directory: relay
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o "dist/relayd-linux-${{ matrix.goarch }}" ./cmd/relayd
          ( cd dist && sha256sum "relayd-linux-${{ matrix.goarch }}" > "relayd-linux-${{ matrix.goarch }}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: relayd-linux-${{ matrix.goarch }}
          path: relay/dist/*

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/relayd:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}/relayd:latest

  release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [version, binaries, image]
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: relayd ${{ needs.version.outputs.version }}
          draft: true
          files: dist/*
