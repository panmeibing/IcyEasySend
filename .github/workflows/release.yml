name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 1.3.0)"
        required: true
        type: string
      create_draft_release:
        description: "Create a draft GitHub Release and upload assets"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
  FLUTTER_GIT_URL: https://gitee.com/mirrors/Flutter.git

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            SHOULD_RELEASE="${{ inputs.create_draft_release }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  linux-amd64:
    name: Linux amd64
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-linux-amd64-${{ hashFiles('**/pubspec.lock') }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config patchelf file \
            libgtk-3-dev liblzma-dev libstdc++-13-dev \
            libsecret-1-dev libayatana-appindicator3-dev dpkg

      - name: Normalize shell scripts
        run: find installers/Linux -name '*.sh' -exec sed -i 's/\r$//' {} +

      - name: Build and package
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          flutter pub get
          flutter build linux --release
          bash installers/Linux/build_deb.sh "${VERSION}" 1
          bash installers/Linux/package_release.sh "${VERSION}"
          mkdir -p release
          cp installers/Linux/dist/icy-easy-send_${VERSION}-1_amd64.deb \
            "release/IcyEasySend-linux-amd64-v${VERSION}.deb"
          cp "installers/Linux/dist/IcyEasySend-linux-amd64-v${VERSION}.tar.gz" release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: release/*
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64
    needs: resolve-version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          dpkg --print-architecture

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git unzip curl \
            clang cmake ninja-build pkg-config patchelf file \
            libgtk-3-dev liblzma-dev libstdc++-13-dev \
            libsecret-1-dev libayatana-appindicator3-dev dpkg

      - name: Install Flutter SDK
        run: |
          git clone https://gitee.com/mirrors/Flutter.git -b stable --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version
          flutter precache --linux
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      - uses: dtolnay/rust-toolchain@stable

      - name: Normalize shell scripts
        run: find installers/Linux -name '*.sh' -exec sed -i 's/\r$//' {} +

      - name: Verify Flutter toolchain
        run: flutter doctor -v

      - name: Build and package
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          flutter pub get
          flutter build linux --release
          bash installers/Linux/build_deb.sh "${VERSION}" 1
          bash installers/Linux/package_release.sh "${VERSION}"
          mkdir -p release
          cp installers/Linux/dist/icy-easy-send_${VERSION}-1_arm64.deb \
            "release/IcyEasySend-linux-arm64-v${VERSION}.deb"
          cp "installers/Linux/dist/IcyEasySend-linux-arm64-v${VERSION}.tar.gz" release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Chinese language file
        shell: pwsh
        run: |
          $languagesDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          Copy-Item -Force "installers\Windows\ChineseSimplified.isl" "$languagesDir\ChineseSimplified.isl"

      - name: Build and package
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-version.outputs.version }}"
          flutter pub get
          flutter build windows --release
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "installers\Windows\setup_script.iss"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "installers\Windows\Output\IcyEasySend_setup_$version.exe" "release\"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/IcyEasySend_setup_*.exe
          if-no-files-found: error

  macos:
    name: macOS
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and package
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
          bash installers/MacOS/build_dmg.sh "${VERSION}"
          mkdir -p release
          cp "installers/MacOS/Output/IcyEasySend-macOS-v${VERSION}.dmg" release/

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/IcyEasySend-macOS-v*.dmg
          if-no-files-found: error

  android:
    name: Android
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Android signing secrets are not configured."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/icy_easy_send_key.jks
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=icy_easy_send_key.jks" \
            > android/key.properties

      - name: Build APK and AAB
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/IcyEasySend-android-v${VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release/IcyEasySend-android-v${VERSION}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*
          if-no-files-found: error

  release:
    name: Publish draft release
    needs:
      - resolve-version
      - linux-amd64
      - linux-arm64
      - windows
      - macos
      - android
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: IcyEasySend ${{ needs.resolve-version.outputs.version }}
          draft: true
          generate_release_notes: false
          body: |
            ## IcyEasySend ${{ needs.resolve-version.outputs.version }}

            请在发布前补充 Release Notes。

            ### 附件说明
            - Linux amd64: `.deb` / `.tar.gz`
            - Linux arm64: `.deb` / `.tar.gz`
            - Windows x64: `.exe` 安装包
            - macOS: 未签名 `.dmg`
            - Android: `.apk` / `.aab`
          files: dist/**
          fail_on_unmatched_files: true
