name: Relay CI

# Scoped to relay/** so Dart-only changes never wait on a Go build, and vice
# versa. The workflow file itself is included so changes to it are validated.
on:
  push:
    branches:
      - main
      - master
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: relay

jobs:
  check:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      # The relay is almost entirely concurrent code, so the race detector is
      # the single most valuable check here.
      - name: Test
        run: go test -race -shuffle=on ./...

  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/relayd
